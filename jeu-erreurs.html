<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nox - Chasse aux erreurs</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    background: linear-gradient(180deg, #13174a 0%, #262d84 50%, #3f4dbf 100%);
    color: #ffffff;
    min-height: 100vh;
    overflow-x: hidden;
    overflow-y: scroll;
}

.container {
    max-width: 700px;
    margin: 0 auto;
    padding: 20px;
    box-sizing: border-box;
}

.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
}

.btn-retour {
    background: rgba(255, 255, 255, 0.15);
    color: #7fe7ff;
    text-decoration: none;
    padding: 8px 16px;
    border-radius: 12px;
    font-weight: 600;
    font-size: 14px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: background 0.2s ease, transform 0.1s ease;
}

.btn-retour:hover {
    background: rgba(255, 255, 255, 0.25);
    transform: translateY(-1px);
}

.badge-manche {
    font-size: 13px;
    color: #ffd166;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(255, 209, 102, 0.15);
    padding: 6px 12px;
    border-radius: 12px;
    border: 1px solid rgba(255, 209, 102, 0.3);
}

.header {
    text-align: center;
    margin-bottom: 15px;
}

.nox-container {
    width: 100%;
    height: 95px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: visible;
}

.nox {
    width: 80px;
    height: 80px;
    object-fit: contain;
    user-select: none;
    will-change: transform, filter;
    animation: flotter 4s ease-in-out infinite, briller 2s ease-in-out infinite;
}

@keyframes briller {
    0% { filter: drop-shadow(0 0 8px #7FE7FF); }
    50% { filter: drop-shadow(0 0 25px #E2A7FF); }
    100% { filter: drop-shadow(0 0 8px #7FE7FF); }
}

@keyframes flotter {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-8px); }
}

.header h1 {
    margin: 8px 0 4px 0;
    font-size: 22px;
    font-weight: 800;
}

.header p {
    margin: 0;
    font-size: 13px;
    color: #cbd5e1;
}

.card {
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 24px;
    padding: 20px;
    box-shadow: 0 12px 36px rgba(0, 0, 0, 0.35);
}

.status-bar {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    font-weight: 700;
    color: #f1f5f9;
    margin-bottom: 8px;
}

.progress {
    width: 100%;
    height: 12px;
    background: rgba(0, 0, 0, 0.45);
    border-radius: 50px;
    overflow: hidden;
    margin-bottom: 16px;
}

.progress-fill {
    width: 0%;
    height: 100%;
    background: linear-gradient(90deg, #7fe7ff, #c896ff);
    transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.schema-container {
    width: 100%;
    background: radial-gradient(circle at center, #0f1c3f 0%, #070b1a 100%);
    border-radius: 16px;
    border: 1px solid rgba(127, 231, 255, 0.25);
    padding: 12px;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 14px;
    min-height: 160px;
    box-sizing: border-box;
}

.schema-svg {
    max-width: 100%;
    height: 150px;
}

.book-area {
    background: rgba(10, 15, 35, 0.85);
    border: 2px dashed rgba(127, 231, 255, 0.35);
    border-radius: 16px;
    padding: 18px;
    min-height: 110px;
    line-height: 1.9;
    font-size: 15px;
    color: #e2e8f0;
}

.word-click {
    cursor: pointer;
    border-radius: 4px;
    padding: 1px 4px;
    transition: background 0.15s ease, color 0.15s ease;
    user-select: none;
}

.word-click:hover {
    background: rgba(255, 255, 255, 0.15);
}

.word-click.correct-error {
    background: rgba(108, 255, 149, 0.25);
    color: #6cff95;
    text-decoration: line-through;
    border-bottom: 2px solid #6cff95;
    cursor: default;
}

.word-click.wrong-click {
    background: rgba(255, 95, 122, 0.3);
    color: #ff8598;
}

button.btn-action {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
    color: #070b19;
    font-weight: 800;
    font-size: 15px;
    margin-top: 18px;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(0, 242, 254, 0.3);
    transition: opacity 0.2s ease, transform 0.1s ease;
}

button.btn-action:hover {
    opacity: 0.92;
    transform: translateY(-1px);
}

.reward {
    text-align: center;
    font-size: 18px;
    font-weight: 700;
    color: #6cff95;
    margin-top: 15px;
    padding: 14px;
    border-radius: 14px;
    background: rgba(108, 255, 149, 0.1);
    border: 1px solid rgba(108, 255, 149, 0.25);
    display: none;
}
</style>
</head>
<body>

<div class="container">

    <div class="top-bar">
        <a href="index.html" class="btn-retour">
            <i class="fa-solid fa-arrow-left"></i> Retour au QG
        </a>
        <div class="badge-manche">
            <i class="fa-solid fa-flag-checkered"></i> Manche : <span id="manche-text">1 / 10</span>
        </div>
    </div>

    <div class="header">
        <div class="nox-container">
            <img class="nox" id="nox-img" src="images/Nox.png" alt="Nox">
        </div>
        <h1>Chasse aux erreurs</h1>
        <p>Observe le schéma et trouve les 2 erreurs cachées dans l'explication !</p>
    </div>

    <div class="card">
        <div class="status-bar">
            <span>Erreurs trouvées :</span>
            <span><span id="count">0</span> / 2</span>
        </div>

        <div class="progress">
            <div id="bar" class="progress-fill"></div>
        </div>

        <!-- Schéma visuel adapté automatiquement à la matière -->
        <div class="schema-container" id="schema-display"></div>

        <!-- Texte de cours naturel sans mention du document -->
        <div class="book-area" id="lesson-content">
            <p><i class="fa-solid fa-spinner fa-spin"></i> Analyse de la leçon en cours...</p>
        </div>

        <button class="btn-action" id="btn-suite" onclick="passerTexteSuivant()">
            Vérifier et continuer
        </button>

        <div id="reward" class="reward">
            ⭐ Félicitations Coco !<br>
            Tu as démasqué toutes les anomalies des 10 textes (+50 XP pour Nox) !
        </div>
    </div>

</div>

<script type="module">
    import { db } from "./firebase.js";
    import { collection, getDocs, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

    const ELEVE_ID = "coco";
    const TOTAL_MANCHES = 10;
    const ERREURS_PAR_MANCHE = 2;

    let manchesActives = [];

    const BANQUES = {
        bio: [
            {
                schema: `<svg viewBox="0 0 320 160" class="schema-svg"><ellipse cx="160" cy="80" rx="120" ry="60" fill="#0b1e36" stroke="#00f2fe" stroke-width="3"/><circle cx="140" cy="80" r="28" fill="#311b92" stroke="#e040fb" stroke-width="2"/><text x="140" y="84" fill="#ffffff" font-size="9" text-anchor="middle" font-weight="bold">Noyau (ADN)</text><text x="160" y="24" fill="#80deea" font-size="10" text-anchor="middle" font-weight="bold">Cellule animale</text></svg>`,

            {

                texte: `Le microscope optique permet d'observer l'infiniment petit grâce à <span class="word-click" onclick="clickWord(this, false)">l'oculaire et les objectifs</span>. On effectue la mise au point en <span class="word-click" onclick="clickWord(this, true)">frappant fort sur la lame de verre</span>. La lentille oculaire sert également à <span class="word-click" onclick="clickWord(this, true)">projeter un son aigu dans l'oreille</span> pour guider la mise au point.`
            },
            {
                schema: `<svg viewBox="0 0 320 160" class="schema-svg"><circle cx="160" cy="80" r="58" fill="#102027" stroke="#00e676" stroke-width="4" stroke-dasharray="6,4"/><text x="160" y="22" fill="#69f0ae" font-size="10" text-anchor="middle" font-weight="bold">Membrane plasmique</text></svg>`,
                texte: `La <span class="word-click" onclick="clickWord(this, false)">membrane plasmique</span> isole la cellule tout en régulant ses flux de nutriments. Cette enveloppe protectrice est <span class="word-click" onclick="clickWord(this, true)">imperméable et faite d'écorce d'arbre</span>. Lors de la filtration, elle <span class="word-click" onclick="clickWord(this, true)">retient tous les déchets toxiques à l'intérieur</span> pour alimenter le noyau.`

            {
                schema: `<svg viewBox="0 0 320 160" class="schema-svg"><ellipse cx="160" cy="80" rx="130" ry="55" fill="rgba(33, 150, 243, 0.15)" stroke="#29b6f6" stroke-width="2"/><text x="160" y="24" fill="#b3e5fc" font-size="10" text-anchor="middle" font-weight="bold">Le cytoplasme cellulaire</text></svg>`,
                texte: `Le <span class="word-click" onclick="clickWord(this, false)">cytoplasme</span> forme la gelée fluide dans laquelle reposent tous les organites. Ce milieu interne est en réalité <span class="word-click" onclick="clickWord(this, true)">rempli de ciment solide figé</span>. Son rôle premier consiste à <span class="word-click" onclick="clickWord(this, true)">brûler la cellule pour réchauffer le corps</span> durant la nuit.`

            {

                texte: `Les cellules des plantes possèdent une <span class="word-click" onclick="clickWord(this, false)">paroi cellulosique</span> rigide assurant leur tenue verticale. Cette structure extérieure est <span class="word-click" onclick="clickWord(this, true)">présente dans les globules rouges humains</span>. De plus, son action <span class="word-click" onclick="clickWord(this, true)">rend la plante liquide dès qu'il fait chaud</span> pour irriguer les tiges.`
            },
            {
                schema: `<svg viewBox="0 0 320 160" class="schema-svg"><ellipse cx="160" cy="80" rx="80" ry="45" fill="#2e7d32" stroke="#76ff03" stroke-width="2"/><text x="160" y="25" fill="#ccff90" font-size="10" text-anchor="middle" font-weight="bold">Chloroplaste & Photosynthèse</text></svg>`,
                texte: `La teinte verte des végétaux provient des <span class="word-click" onclick="clickWord(this, false)">chloroplastes</span> contenant la chlorophylle. Dans les feuilles, ces capteurs sont <span class="word-click" onclick="clickWord(this, true)">responsables de la digestion des os</span>. En absorbant les rayons du soleil, ils permettent de <span class="word-click" onclick="clickWord(this, true)">fabriquer du plastique sous terre</span> en continu.`

            {

                texte: `Pour examiner un tissu au microscope, on le place dans une gouttelette entre <span class="word-click" onclick="clickWord(this, false)">la lame et la lamelle</span>. Afin d'obtenir une observation nette, il convient d'<span class="word-click" onclick="clickWord(this, true)">emprisonner de grosses bulles d'air géantes</span>. On finalise l'installation en prenant soin de <span class="word-click" onclick="clickWord(this, true)">peindre la lamelle avec de l'encre noire opaque</span>.`

                texte: `Le <span class="word-click" onclick="clickWord(this, false)">grossissement total</span> d'une préparation combine la force de grossissement de l'oculaire et de l'objectif. La formule requise s'obtient en <span class="word-click" onclick="clickWord(this, true)">divisant les valeurs par zéro</span>. Ce réglage précis a pour effet de rendre l'échantillon <span class="word-click" onclick="clickWord(this, true)">absolument invisible à l'écran</span>.`
            },
            {

                texte: `La <span class="word-click" onclick="clickWord(this, false)">vacuole</span> emmagasine l'eau et assure le maintien turgescent des cellules végétales. Cette vaste poche interne demeure <span class="word-click" onclick="clickWord(this, true)">remplie d'essence de voiture inflammable</span>. Par ailleurs, elle <span class="word-click" onclick="clickWord(this, true)">sert à propulser la feuille dans les airs</span> dès l'apparition des fleurs.`
            },
            {
                schema: `<svg viewBox="0 0 320 160" class="schema-svg"><path d="M 100,80 C 100,50 140,40 180,45 C 220,50 230,80 210,110 C 190,125 120,120 100,80 Z" fill="#00695c" stroke="#64ffda" stroke-width="2"/><text x="160" y="22" fill="#64ffda" font-size="10" text-anchor="middle" font-weight="bold">Organisme unicellulaire</text></svg>`,
                texte: `Les organismes <span class="word-click" onclick="clickWord(this, false)">unicellulaires</span> effectuent toutes leurs fonctions vitales au sein d'une unique cellule autonome. Pour se protéger du milieu, ces êtres microscopiques <span class="word-click" onclick="clickWord(this, true)">possèdent un squelette composé d'acier</span>. Enfin, ils sont connus pour être <span class="word-click" onclick="clickWord(this, true)">capables de vivre uniquement sur le soleil</span> sans eau.`

        ],
        geo: [
            {
                schema: `<svg viewBox="0 0 320 160" class="schema-svg"><circle cx="160" cy="80" r="55" fill="#0b1e36" stroke="#00f2fe" stroke-width="2"/><line x1="105" y1="80" x2="215" y2="80" stroke="#ff5858" stroke-width="3"/><text x="160" y="75" fill="#ff5858" font-size="9" text-anchor="middle" font-weight="bold">Équateur (0°)</text></svg>`,
                texte: `Sur le globe terrestre, <span class="word-click" onclick="clickWord(this, false)">l'équateur</span> partage la planète en deux hémisphères. Cette ligne de référence fondamentale forme en réalité un tracé <span class="word-click" onclick="clickWord(this, true)">parfaitement vertical reliant les pôles</span>. Sa position centrale lui confère une latitude de <span class="word-click" onclick="clickWord(this, true)">quatre-vingt-dix degrés Nord</span>.`

                texte: `Les demi-cercles verticaux joignant le pôle Nord au pôle Sud sont les <span class="word-click" onclick="clickWord(this, false)">méridiens</span>. Sur un planisphère mondial, ces axes présentent des longueurs <span class="word-click" onclick="clickWord(this, true)">complètement inégales entre elles</span>. Ils parcourent la surface du globe d'une façon <span class="word-click" onclick="clickWord(this, true)">strictement horizontale</span>.`

            },
            {
                schema: `<svg viewBox="0 0 320 160" class="schema-svg"><circle cx="160" cy="80" r="45" fill="none" stroke="#94a3b8" stroke-dasharray="2"/><polygon points="160,35 165,80 160,75 155,80" fill="#ff5858"/><text x="160" y="30" fill="#ff5858" font-size="10" text-anchor="middle" font-weight="bold">N</text></svg>`,
                texte: `Le symbole d'orientation gravé sur les cartes maritimes est <span class="word-click" onclick="clickWord(this, false)">la rose des vents</span>. Sur un document cartographique orienté, la pointe de l'Est regarde <span class="word-click" onclick="clickWord(this, true)">vers la gauche de la page</span>. De plus, son aiguille bicolore pointe toujours vers <span class="word-click" onclick="clickWord(this, true)">l'ouest géographique</span>.`
            }
        ],
        general: [
            {
                schema: `<svg viewBox="0 0 320 160" class="schema-svg"><rect x="80" y="25" width="160" height="110" rx="10" fill="#0b1e36" stroke="#7fe7ff" stroke-width="2"/><line x1="100" y1="50" x2="220" y2="50" stroke="#ffffff" stroke-width="2"/><line x1="100" y1="75" x2="200" y2="75" stroke="#ffffff" stroke-width="2"/><text x="160" y="115" fill="#7fe7ff" font-size="10" text-anchor="middle" font-weight="bold">Méthode de travail & synthèse</text></svg>`,
                texte: `L'apprentissage méthodique repose sur <span class="word-click" onclick="clickWord(this, false)">la mémorisation active</span> des notions essentielles. Cette technique permet de retenir des informations <span class="word-click" onclick="clickWord(this, true)">en dormant sans jamais réviser</span>. Une synthèse bien construite a également pour propriété d'<span class="word-click" onclick="clickWord(this, true)">effacer tous les souvenirs antérieurs</span>.`
            },
            {
                schema: `<svg viewBox="0 0 320 160" class="schema-svg"><circle cx="160" cy="80" r="45" fill="#1b2a4a" stroke="#ffd54f" stroke-width="2"/><text x="160" y="85" fill="#ffd54f" font-size="12" text-anchor="middle" font-weight="bold">Analyse logique</text></svg>`,
                texte: `Face à un problème complexe, <span class="word-click" onclick="clickWord(this, false)">le raisonnement critique</span> permet de décomposer chaque étape avec clarté. Cette approche requiert d'<span class="word-click" onclick="clickWord(this, true)">ignorer totalement les données de départ</span>. La solution validée doit par ailleurs demeurer <span class="word-click" onclick="clickWord(this, true)">strictement secrète et inutile</span>.`
            }
        ]
    };

    async function initialiserJeu() {
        try {
            const q = query(
                collection(db, "utilisateurs", ELEVE_ID, "fiches_cours"),
                orderBy("timestamp", "desc"),
                limit(1)
            );
            const querySnapshot = await getDocs(q);

            let titreCours = "";
            if (!querySnapshot.empty) {
                querySnapshot.forEach(doc => {
                    const data = doc.data();
                    if (data.titre) titreCours = data.titre;
                });
            }

            // Sélectionne automatiquement la banque selon le titre scanné
            const t = titreCours.toLowerCase();
            if (t.includes("bio") || t.includes("cellul") || t.includes("microscop") || t.includes("corps")) {
                manchesActives = BANQUES.bio;
            } else if (t.includes("géo") || t.includes("carte") || t.includes("coordonné") || t.includes("hémisphèr")) {
                manchesActives = BANQUES.geo;
            } else {
                // Si la matière n'a que 2 fiches modèles, on la complète jusqu'à 10
                manchesActives = BANQUES.general;
                while (manchesActives.length < TOTAL_MANCHES) {
                    manchesActives.push(BANQUES.general[manchesActives.length % BANQUES.general.length]);
                }
            }

            afficherManche(mancheActuelle);

        } catch (err) {
            console.error("Firestore:", err);
            manchesActives = BANQUES.bio;
            afficherManche(mancheActuelle);
        }
    }

    function afficherManche(index) {
        erreursTrouvees = 0;
        document.getElementById("count").innerText = "0";
        document.getElementById("bar").style.width = "0%";
        document.getElementById("manche-text").innerText = `${index} / ${TOTAL_MANCHES}`;

        const donnees = manchesActives[index - 1];
        document.getElementById("schema-display").innerHTML = donnees.schema;
        document.getElementById("lesson-content").innerHTML = donnees.texte;
    }

    window.clickWord = function(element, isError) {
        if (element.classList.contains("correct-error")) return;

        if (isError) {
            element.classList.remove("wrong-click");
            element.classList.add("correct-error");
            erreursTrouvees++;
            document.getElementById("count").innerText = erreursTrouvees;
            document.getElementById("bar").style.width = (erreursTrouvees / ERREURS_PAR_MANCHE) * 100 + "%";

            if (erreursTrouvees === ERREURS_PAR_MANCHE) {
                setTimeout(() => {
                    passerTexteSuivant();
                }, 800);
            }
        } else {
            element.classList.add("wrong-click");
            setTimeout(() => {
                element.classList.remove("wrong-click");
            }, 700);
        }
    };

    window.passerTexteSuivant = function() {
        if (erreursTrouvees < ERREURS_PAR_MANCHE) {
            alert(`Il reste encore ${ERREURS_PAR_MANCHE - erreursTrouvees} erreur(s) à démasquer sur ce schéma !`);
            return;
        }

        if (mancheActuelle < TOTAL_MANCHES) {
            mancheActuelle++;
            afficherManche(mancheActuelle);
        } else {
            document.getElementById("schema-display").style.display = "none";
            document.getElementById("lesson-content").style.display = "none";
            document.getElementById("btn-suite").style.display = "none";
            document.getElementById("reward").style.display = "block";
            setTimeout(() => {
                window.location.href = "index.html";
            }, 3000);
        }
    };

    initialiserJeu();
</script>
