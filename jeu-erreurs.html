<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nox - Chasse aux erreurs</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(180deg, #13174a, #262d84, #3f4dbf);
    color: white;
    min-height: 100vh;
}

.container {
    max-width: 700px;
    margin: auto;
    padding: 20px;
}

.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
}

.btn-retour {
    background: rgba(255, 255, 255, 0.15);
    color: #7fe7ff;
    text-decoration: none;
    padding: 8px 14px;
    border-radius: 12px;
    font-weight: 600;
    font-size: 14px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: 0.2s;
}

.btn-retour:hover {
    background: rgba(255, 255, 255, 0.25);
}

.header {
    text-align: center;
}

/* Nox magique : flottaison et lueur */
.nox {
    width: 90px;
    height: 90px;
    object-fit: contain;
    animation:
        flotter 4s ease-in-out infinite,
        briller 2s ease-in-out infinite;
}

@keyframes briller {
    0% { filter: drop-shadow(0 0 10px #7FE7FF); }
    50% { filter: drop-shadow(0 0 30px #E2A7FF); }
    100% { filter: drop-shadow(0 0 10px #7FE7FF); }
}

@keyframes flotter {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-12px); }
}

.header h1 {
    margin: 10px 0 4px 0;
    font-size: 24px;
}

.lesson-badge {
    display: inline-block;
    background: rgba(127, 231, 255, 0.15);
    color: #7fe7ff;
    border: 1px solid rgba(127, 231, 255, 0.3);
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 13px;
    margin-top: 6px;
}

.card {
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 25px;
    padding: 20px;
    margin-top: 15px;
}

.status-bar {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 8px;
}

.progress {
    width: 100%;
    height: 16px;
    background: rgba(0, 0, 0, 0.4);
    border-radius: 50px;
    overflow: hidden;
    margin-bottom: 20px;
}

.progress-fill {
    width: 0%;
    height: 100%;
    background: linear-gradient(90deg, #7fe7ff, #c896ff);
    transition: width 0.3s ease;
}

/* Zone du texte ou page de cours */
.book-area {
    position: relative;
    background: rgba(10, 15, 35, 0.85);
    border: 2px dashed rgba(127, 231, 255, 0.35);
    border-radius: 20px;
    padding: 24px 20px;
    min-height: 260px;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.book-text {
    font-size: 15px;
    line-height: 1.8;
    color: #e2e8f0;
}

/* Cibles d'erreurs cliquables */
.error-target {
    display: inline;
    padding: 2px 6px;
    border-radius: 8px;
    background: rgba(255, 95, 122, 0.2);
    border-bottom: 2px dashed #ff5f7a;
    cursor: pointer;
    transition: all 0.2s ease;
}

.error-target:hover {
    background: rgba(255, 95, 122, 0.4);
    transform: scale(1.03);
}

.error-target.found {
    background: rgba(108, 255, 149, 0.25);
    border-bottom: 2px solid #6cff95;
    color: #6cff95;
    text-decoration: line-through;
    cursor: default;
}

button {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 15px;
    background: linear-gradient(135deg, #4facfe, #00f2fe);
    color: #070b19;
    font-weight: 700;
    font-size: 16px;
    margin-top: 20px;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(0, 242, 254, 0.3);
    transition: 0.2s ease;
}

button:hover {
    opacity: 0.92;
}

.reward {
    text-align: center;
    font-size: 20px;
    font-weight: 700;
    color: #6cff95;
    margin-top: 20px;
    display: none;
}
</style>
</head>
<body>

<div class="container">

    <div class="top-bar">
        <a href="index.html" class="btn-retour">
            <i class="fa-solid fa-arrow-left"></i> Retour au QG
        </a>
        <div style="font-size: 13px; color: #ffd166; font-weight: 700;">
            <i class="fa-solid fa-star"></i> +50 XP
        </div>
    </div>

    <div class="header">
        <img class="nox" src="Images/Nox.png" alt="Nox">
        <h1>Chasse aux erreurs</h1>
        <p>Aide Nox à débusquer les 3 erreurs cachées dans la leçon !</p>
        <div id="lesson-title" class="lesson-badge">
            <i class="fa-solid fa-spinner fa-spin"></i> Chargement de la matière...
        </div>
    </div>

    <div class="card">
        <div class="status-bar">
            <span>Erreurs trouvées :</span>
            <span><span id="count">0</span> / 3</span>
        </div>

        <div class="progress">
            <div id="bar" class="progress-fill"></div>
        </div>

        <!-- Zone de la leçon avec les pièges insérés dynamiquement -->
        <div class="book-area">
            <p id="lesson-content" class="book-text">
                Analyse de la leçon en cours...
            </p>
        </div>

        <button onclick="finishGame()">
            Vérifier et restaurer la page
        </button>

        <div id="reward" class="reward">
            ⭐ Bravo Coco !<br>
            Tu as démasqué toutes les anomalies (+50 XP pour Nox) !
        </div>
    </div>

</div>

<script type="module">
    import { db } from "./firebase.js";
    import { collection, getDocs, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

    const ELEVE_ID = "coco";
    const TOTAL_ERREURS = 3;
    let found = 0;

    async function chargerLecon() {
        const badge = document.getElementById("lesson-title");
        const content = document.getElementById("lesson-content");

        try {
            const q = query(
                collection(db, "utilisateurs", ELEVE_ID, "fiches_cours"),
                orderBy("timestamp", "desc"),
                limit(1)
            );
            const querySnapshot = await getDocs(q);

            let titre = "Aide-mémoire de géographie";
            let concept = "coordonnées";

            if (!querySnapshot.empty) {
                querySnapshot.forEach(doc => {
                    const data = doc.data();
                    if (data.titre) titre = data.titre;
                    if (data.conceptsCles && data.conceptsCles.length > 0) {
                        concept = data.conceptsCles[0];
                    }
                });
            }

            badge.innerHTML = `<i class="fa-solid fa-book-open"></i> ${titre}`;

            // Génération d'un texte d'exercice lié au cours avec 3 pièges
            content.innerHTML = `
                Pour bien comprendre <strong>${titre}</strong>, rappelons les bases. 
                Sur un planisphère, l'équateur sépare la Terre en deux 
                <span class="error-target" onclick="findError(this)">triangles inversés</span>. 
                De plus, pour déterminer l'emplacement exact de <em>${concept}</em>, on affirme à tort que 
                <span class="error-target" onclick="findError(this)">les degrés de latitude n'ont aucune valeur</span>. 
                Enfin, sache que le pôle Nord et le pôle Sud sont 
                <span class="error-target" onclick="findError(this)">situés au centre exact de l'océan Pacifique</span>.
            `;

        } catch (err) {
            console.error("Erreur Firestore :", err);
            badge.textContent = "Mode Entraînement";
            content.innerHTML = `
                Voici un extrait à corriger : 
                La Terre est <span class="error-target" onclick="findError(this)">parfaitement carrée</span>. 
                Le soleil tourne <span class="error-target" onclick="findError(this)">autour d'une lampe de poche</span>. 
                Et l'eau gèle à <span class="error-target" onclick="findError(this)">100 degrés au soleil</span>.
            `;
        }
    }

    window.findError = function(element) {
        if (element.classList.contains("found")) return;

        element.classList.add("found");
        found++;

        document.getElementById("count").innerText = found;
        document.getElementById("bar").style.width = (found / TOTAL_ERREURS) * 100 + "%";
    };

    window.finishGame = function() {
        if (found < TOTAL_ERREURS) {
            alert(`Il reste encore ${TOTAL_ERREURS - found} erreur(s) cachée(s) dans le texte !`);
            return;
        }

        document.getElementById("reward").style.display = "block";
        setTimeout(() => {
            window.location.href = "index.html";
        }, 2500);
    };

    chargerLecon();
</script>

</body>
</html>
