<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nox - Chasse aux erreurs</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
/* =========================================
   STYLE GLOBAL & STABILISATION DU DÉFILEMENT
   ========================================= */
body {
    margin: 0;
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    background: linear-gradient(180deg, #13174a 0%, #262d84 50%, #3f4dbf 100%);
    color: #ffffff;
    min-height: 100vh;
    overflow-x: hidden;
    overflow-y: scroll;
}

.container {
    max-width: 700px;
    margin: 0 auto;
    padding: 20px;
    box-sizing: border-box;
}

/* =========================================
   BARRE DE NAVIGATION SUPÉRIEURE
   ========================================= */
.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
}

.btn-retour {
    background: rgba(255, 255, 255, 0.15);
    color: #7fe7ff;
    text-decoration: none;
    padding: 8px 16px;
    border-radius: 12px;
    font-weight: 600;
    font-size: 14px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: background 0.2s ease, transform 0.1s ease;
}

.btn-retour:hover {
    background: rgba(255, 255, 255, 0.25);
    transform: translateY(-1px);
}

.badge-manche {
    font-size: 13px;
    color: #ffd166;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(255, 209, 102, 0.15);
    padding: 6px 12px;
    border-radius: 12px;
    border: 1px solid rgba(255, 209, 102, 0.3);
}

/* =========================================
   EN-TÊTE & NOX ANIMÉ
   ========================================= */
.header {
    text-align: center;
    margin-bottom: 20px;
}

.nox-container {
    width: 100%;
    height: 105px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: visible;
}

.nox {
    width: 85px;
    height: 85px;
    object-fit: contain;
    user-select: none;
    will-change: transform, filter;
    animation: 
        flotter 4s ease-in-out infinite, 
        briller 2s ease-in-out infinite;
}

@keyframes briller {
    0% { filter: drop-shadow(0 0 8px #7FE7FF); }
    50% { filter: drop-shadow(0 0 25px #E2A7FF); }
    100% { filter: drop-shadow(0 0 8px #7FE7FF); }
}

@keyframes flotter {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-8px); }
}

.header h1 {
    margin: 10px 0 6px 0;
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -0.5px;
}

.header p {
    margin: 0;
    font-size: 14px;
    color: #cbd5e1;
}

.lesson-badge {
    display: inline-block;
    background: rgba(127, 231, 255, 0.15);
    color: #7fe7ff;
    border: 1px solid rgba(127, 231, 255, 0.3);
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    margin-top: 10px;
}

/* =========================================
   CARTE PRINCIPALE DU JEU
   ========================================= */
.card {
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 24px;
    padding: 24px;
    box-shadow: 0 12px 36px rgba(0, 0, 0, 0.35);
}

.status-bar {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    font-weight: 700;
    color: #f1f5f9;
    margin-bottom: 10px;
}

.progress {
    width: 100%;
    height: 14px;
    background: rgba(0, 0, 0, 0.45);
    border-radius: 50px;
    overflow: hidden;
    margin-bottom: 22px;
}

.progress-fill {
    width: 0%;
    height: 100%;
    background: linear-gradient(90deg, #7fe7ff, #c896ff);
    transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

/* =========================================
   ZONE DE TEXTE ET CLICS
   ========================================= */
.book-area {
    background: rgba(10, 15, 35, 0.85);
    border: 2px dashed rgba(127, 231, 255, 0.35);
    border-radius: 18px;
    padding: 22px;
    min-height: 180px;
    line-height: 2;
    font-size: 15px;
    color: #e2e8f0;
}

.word-click {
    cursor: pointer;
    border-radius: 4px;
    padding: 2px 4px;
    transition: background 0.15s ease, color 0.15s ease;
    user-select: none;
}

.word-click:hover {
    background: rgba(255, 255, 255, 0.15);
}

.word-click.correct-error {
    background: rgba(108, 255, 149, 0.25);
    color: #6cff95;
    text-decoration: line-through;
    border-bottom: 2px solid #6cff95;
    cursor: default;
}

.word-click.wrong-click {
    background: rgba(255, 95, 122, 0.3);
    color: #ff8598;
}

/* =========================================
   BOUTON DE SUITE & RÉCOMPENSE
   ========================================= */
button.btn-action {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 16px;
    background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
    color: #070b19;
    font-weight: 800;
    font-size: 16px;
    margin-top: 22px;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(0, 242, 254, 0.3);
    transition: opacity 0.2s ease, transform 0.1s ease;
}

button.btn-action:hover {
    opacity: 0.92;
    transform: translateY(-1px);
}

.reward {
    text-align: center;
    font-size: 18px;
    font-weight: 700;
    color: #6cff95;
    margin-top: 20px;
    padding: 14px;
    border-radius: 14px;
    background: rgba(108, 255, 149, 0.1);
    border: 1px solid rgba(108, 255, 149, 0.25);
    display: none;
}
</style>
</head>
<body>

<div class="container">

    <div class="top-bar">
        <a href="index.html" class="btn-retour">
            <i class="fa-solid fa-arrow-left"></i> Retour au QG
        </a>
        <div class="badge-manche">
            <i class="fa-solid fa-flag-checkered"></i> Manche : <span id="manche-text">1 / 10</span>
        </div>
    </div>

    <div class="header">
        <div class="nox-container">
            <img class="nox" id="nox-img" src="images/Nox.png" alt="Nox">
        </div>
        <h1>Chasse aux erreurs</h1>
        <p>Aide Nox à débusquer les 2 erreurs cachées dans chaque texte !</p>
        <div id="lesson-title" class="lesson-badge">
            <i class="fa-solid fa-spinner fa-spin"></i> Chargement de la leçon...
        </div>
    </div>

    <div class="card">
        <div class="status-bar">
            <span>Erreurs de ce texte :</span>
            <span><span id="count">0</span> / 2</span>
        </div>

        <div class="progress">
            <div id="bar" class="progress-fill"></div>
        </div>

        <div class="book-area" id="lesson-content">
            <p><i class="fa-solid fa-spinner fa-spin"></i> Préparation des défis...</p>
        </div>

        <button class="btn-action" id="btn-suite" onclick="passerTexteSuivant()">
            Vérifier et passer au texte suivant
        </button>

        <div id="reward" class="reward">
            ⭐ Fantastique Coco !<br>
            Les 10 textes ont été corrigés avec brio (+50 XP pour Nox) !
        </div>
    </div>

</div>

<script type="module">
    import { db } from "./firebase.js";
    import { collection, getDocs, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

    const ELEVE_ID = "coco";
    const TOTAL_MANCHES = 10;
    const ERREURS_PAR_MANCHE = 2;

    let mancheActuelle = 1;
    let erreursTrouvees = 0;
    let titreLecon = "Géographie & Cartographie";

    // 10 thématiques distinctes pour varier chacun des 10 textes
    const SUJETS_10_TEXTES = [
        { theme: "l'équateur", repere: "la latitude 0 degré", faux1: "incliné à 90 degrés", faux2: "passe uniquement par l'Arctique" },
        { theme: "le méridien de Greenwich", repere: "la longitude de référence", faux1: "totalement invisible sur le globe", faux2: "traverse le centre de Tokyo" },
        { theme: "les parallèles", repere: "les cercles imaginaires", faux1: "se croisent tous aux pôles", faux2: "sont tracés en zigzag" },
        { theme: "les méridiens", repere: "les demi-cercles joignant les pôles", faux1: "sont strictement horizontaux", faux2: "mesurent la température de l'eau" },
        { theme: "la latitude", repere: "la distance par rapport à l'équateur", faux1: "se calcule en kilomètres cubes", faux2: "ne dépasse jamais 10 degrés" },
        { theme: "la longitude", repere: "l'écart Est ou Ouest", faux1: "est mesurée par un thermomètre", faux2: "reste toujours égale à zéro" },
        { theme: "l'hémisphère Nord", repere: "la moitié boréale du globe", faux1: "contient le pôle Sud", faux2: "n'a aucune terre émergée" },
        { theme: "l'hémisphère Sud", repere: "la zone australe", faux1: "est chauffé par deux soleils", faux2: "se situe au-dessus de l'équateur" },
        { theme: "l'échelle d'une carte", repere: "le rapport de réduction", faux1: "agrandit la Terre 50 fois", faux2: "sert à mesurer le poids du papier" },
        { theme: "la rose des vents", repere: "l'indicateur des points cardinaux", faux1: "indique l'âge des explorateurs", faux2: "tourne en rond en permanence" }
    ];

    async function initialiserJeu() {
        const badge = document.getElementById("lesson-title");

        try {
            const q = query(
                collection(db, "utilisateurs", ELEVE_ID, "fiches_cours"),
                orderBy("timestamp", "desc"),
                limit(1)
            );
            const querySnapshot = await getDocs(q);

            if (!querySnapshot.empty) {
                querySnapshot.forEach(doc => {
                    const data = doc.data();
                    if (data.titre) titreLecon = data.titre;
                });
            }
        } catch (err) {
            console.error("Firestore:", err);
        }

        badge.innerHTML = `<i class="fa-solid fa-book-open"></i> ${titreLecon}`;
        afficherManche(mancheActuelle);
    }

    function afficherManche(index) {
        erreursTrouvees = 0;
        document.getElementById("count").innerText = "0";
        document.getElementById("bar").style.width = "0%";
        document.getElementById("manche-text").innerText = `${index} / ${TOTAL_MANCHES}`;

        const donnees = SUJETS_10_TEXTES[index - 1];
        const content = document.getElementById("lesson-content");

        content.innerHTML = `
            Dans l'extrait <strong>n°${index}</strong> du cours sur <em>${titreLecon}</em>, Nox examine les règles relatives à 
            <span class="word-click" onclick="clickWord(this, false)">${donnees.theme}</span>. 
            Le carnet indique qu'il représente fidèlement <span class="word-click" onclick="clickWord(this, false)">${donnees.repere}</span>. 
            Pourtant, un schéma erroné prétend qu'il est <span class="word-click" onclick="clickWord(this, true)">${donnees.faux1}</span>. 
            De plus, une note secondaire ajoute qu'il <span class="word-click" onclick="clickWord(this, true)">${donnees.faux2}</span>, 
            ce qui contredit totalement la carte.
        `;
    }

    window.clickWord = function(element, isError) {
        if (element.classList.contains("correct-error")) return;

        if (isError) {
            element.classList.remove("wrong-click");
            element.classList.add("correct-error");
            erreursTrouvees++;
            document.getElementById("count").innerText = erreursTrouvees;
            document.getElementById("bar").style.width = (erreursTrouvees / ERREURS_PAR_MANCHE) * 100 + "%";

            // Si les 2 erreurs du texte courant sont trouvées
            if (erreursTrouvees === ERREURS_PAR_MANCHE) {
                setTimeout(() => {
                    passerTexteSuivant();
                }, 800);
            }
        } else {
            element.classList.add("wrong-click");
            setTimeout(() => {
                element.classList.remove("wrong-click");
            }, 800);
        }
    };

    window.passerTexteSuivant = function() {
        if (erreursTrouvees < ERREURS_PAR_MANCHE) {
            alert(`Il reste encore ${ERREURS_PAR_MANCHE - erreursTrouvees} erreur(s) à démasquer dans ce texte !`);
            return;
        }

        if (mancheActuelle < TOTAL_MANCHES) {
            mancheActuelle++;
            afficherManche(mancheActuelle);
        } else {
            document.getElementById("lesson-content").style.display = "none";
            document.getElementById("btn-suite").style.display = "none";
            document.getElementById("reward").style.display = "block";
            setTimeout(() => {
                window.location.href = "index.html";
            }, 3000);
        }
    };

    initialiserJeu();
</script>

</body>
</html>
