<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nox - Chasse aux erreurs</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    background: linear-gradient(180deg, #13174a 0%, #262d84 50%, #3f4dbf 100%);
    color: #ffffff;
    min-height: 100vh;
    overflow-x: hidden;
    overflow-y: scroll;
}

.container {
    max-width: 700px;
    margin: 0 auto;
    padding: 20px;
    box-sizing: border-box;
}

.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
}

.btn-retour {
    background: rgba(255, 255, 255, 0.15);
    color: #7fe7ff;
    text-decoration: none;
    padding: 8px 16px;
    border-radius: 12px;
    font-weight: 600;
    font-size: 14px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: background 0.2s ease, transform 0.1s ease;
}

.btn-retour:hover {
    background: rgba(255, 255, 255, 0.25);
    transform: translateY(-1px);
}

.badge-manche {
    font-size: 13px;
    color: #ffd166;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(255, 209, 102, 0.15);
    padding: 6px 12px;
    border-radius: 12px;
    border: 1px solid rgba(255, 209, 102, 0.3);
}

.header {
    text-align: center;
    margin-bottom: 15px;
}

.nox-container {
    width: 100%;
    height: 95px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: visible;
}

.nox {
    width: 80px;
    height: 80px;
    object-fit: contain;
    user-select: none;
    will-change: transform, filter;
    animation: flotter 4s ease-in-out infinite, briller 2s ease-in-out infinite;
}

@keyframes briller {
    0% { filter: drop-shadow(0 0 8px #7FE7FF); }
    50% { filter: drop-shadow(0 0 25px #E2A7FF); }
    100% { filter: drop-shadow(0 0 8px #7FE7FF); }
}

@keyframes flotter {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-8px); }
}

.header h1 {
    margin: 8px 0 4px 0;
    font-size: 22px;
    font-weight: 800;
}

.header p {
    margin: 0;
    font-size: 13px;
    color: #cbd5e1;
}

.card {
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 24px;
    padding: 20px;
    box-shadow: 0 12px 36px rgba(0, 0, 0, 0.35);
}

.status-bar {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    font-weight: 700;
    color: #f1f5f9;
    margin-bottom: 8px;
}

.progress {
    width: 100%;
    height: 12px;
    background: rgba(0, 0, 0, 0.45);
    border-radius: 50px;
    overflow: hidden;
    margin-bottom: 16px;
}

.progress-fill {
    width: 0%;
    height: 100%;
    background: linear-gradient(90deg, #7fe7ff, #c896ff);
    transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

/* Zone du schéma réaliste */
.schema-container {
    width: 100%;
    background: radial-gradient(circle at center, #0f1c3f 0%, #070b1a 100%);
    border-radius: 16px;
    border: 1px solid rgba(127, 231, 255, 0.25);
    padding: 12px;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 14px;
    min-height: 170px;
    box-sizing: border-box;
}

.schema-svg {
    max-width: 100%;
    height: 160px;
}

/* Zone de texte de synthèse */
.book-area {
    background: rgba(10, 15, 35, 0.85);
    border: 2px dashed rgba(127, 231, 255, 0.35);
    border-radius: 16px;
    padding: 18px;
    min-height: 110px;
    line-height: 1.9;
    font-size: 15px;
    color: #e2e8f0;
}

.word-click {
    cursor: pointer;
    border-radius: 4px;
    padding: 1px 4px;
    transition: background 0.15s ease, color 0.15s ease;
    user-select: none;
}

.word-click:hover {
    background: rgba(255, 255, 255, 0.15);
}

.word-click.correct-error {
    background: rgba(108, 255, 149, 0.25);
    color: #6cff95;
    text-decoration: line-through;
    border-bottom: 2px solid #6cff95;
    cursor: default;
}

.word-click.wrong-click {
    background: rgba(255, 95, 122, 0.3);
    color: #ff8598;
}

button.btn-action {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
    color: #070b19;
    font-weight: 800;
    font-size: 15px;
    margin-top: 18px;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(0, 242, 254, 0.3);
    transition: opacity 0.2s ease, transform 0.1s ease;
}

button.btn-action:hover {
    opacity: 0.92;
    transform: translateY(-1px);
}

.reward {
    text-align: center;
    font-size: 18px;
    font-weight: 700;
    color: #6cff95;
    margin-top: 15px;
    padding: 14px;
    border-radius: 14px;
    background: rgba(108, 255, 149, 0.1);
    border: 1px solid rgba(108, 255, 149, 0.25);
    display: none;
}
</style>
</head>
<body>

<div class="container">

    <div class="top-bar">
        <a href="index.html" class="btn-retour">
            <i class="fa-solid fa-arrow-left"></i> Retour au QG
        </a>
        <div class="badge-manche">
            <i class="fa-solid fa-flag-checkered"></i> Manche : <span id="manche-text">1 / 10</span>
        </div>
    </div>

    <div class="header">
        <div class="nox-container">
            <img class="nox" id="nox-img" src="images/Nox.png" alt="Nox">
        </div>
        <h1>Chasse aux erreurs</h1>
        <p>Observe le schéma et trouve les 2 erreurs cachées dans l'explication !</p>
    </div>

    <div class="card">
        <div class="status-bar">
            <span>Erreurs trouvées :</span>
            <span><span id="count">0</span> / 2</span>
        </div>

        <div class="progress">
            <div id="bar" class="progress-fill"></div>
        </div>

        <!-- Vrai schéma d'anatomie cellulaire / microscope -->
        <div class="schema-container" id="schema-display"></div>

        <!-- Texte de synthèse sans mention du document -->
        <div class="book-area" id="lesson-content">
            <p><i class="fa-solid fa-spinner fa-spin"></i> Préparation des observations...</p>
        </div>

        <button class="btn-action" id="btn-suite" onclick="passerTexteSuivant()">
            Vérifier et continuer
        </button>

        <div id="reward" class="reward">
            ⭐ Félicitations Coco !<br>
            Tu as maîtrisé toutes les notions sur la cellule et le microscope (+50 XP pour Nox) !
        </div>
    </div>

</div>

<script type="module">
    const TOTAL_MANCHES = 10;
    const ERREURS_PAR_MANCHE = 2;

    let mancheActuelle = 1;
    let erreursTrouvees = 0;

    // 10 synthèses concrètes avec schémas anatomiques complets
    const MANCHES_BIOLOGIE = [
        {
            schema: `
                <svg viewBox="0 0 320 160" class="schema-svg">
                    <defs>
                        <linearGradient id="cellGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#1e3a5f"/>
                            <stop offset="100%" stop-color="#0b1e36"/>
                        </linearGradient>
                    </defs>
                    <!-- Membrane & Cytoplasme -->
                    <ellipse cx="160" cy="80" rx="120" ry="60" fill="url(#cellGrad)" stroke="#00f2fe" stroke-width="3"/>
                    <!-- Noyau -->
                    <circle cx="140" cy="80" r="28" fill="#311b92" stroke="#e040fb" stroke-width="2"/>
                    <circle cx="140" cy="80" r="10" fill="#7c4dff"/>
                    <!-- Organites -->
                    <ellipse cx="220" cy="65" rx="14" ry="7" fill="#ff7043" transform="rotate(20 220 65)"/>
                    <ellipse cx="90" cy="95" rx="12" ry="6" fill="#26a69a" transform="rotate(-30 90 95)"/>
                    <!-- Légendes -->
                    <text x="140" y="84" fill="#ffffff" font-size="9" text-anchor="middle" font-weight="bold">Noyau (ADN)</text>
                    <text x="220" y="52" fill="#ffab91" font-size="8" text-anchor="middle">Mitochondrie</text>
                    <text x="160" y="24" fill="#80deea" font-size="10" text-anchor="middle" font-weight="bold">Schéma de la cellule animale</text>
                </svg>
            `,
            texte: `La cellule constitue l'unité de base de tous les êtres vivants. Elle renferme en son centre <span class="word-click" onclick="clickWord(this, false)">le noyau</span> qui protège le matériel génétique. Pourtant, une note erronée prétend que les cellules animales sont <span class="word-click" onclick="clickWord(this, true)">toutes visibles à l'œil nu sans loupe</span>. De plus, une autre remarque affirme que le noyau est <span class="word-click" onclick="clickWord(this, true)">rempli de gaz carbonique sous pression</span>, ce qui est contraire à la réalité biologique.`
        },
        {
            schema: `
                <svg viewBox="0 0 320 160" class="schema-svg">
                    <!-- Base & Potence du microscope -->
                    <rect x="70" y="130" width="180" height="15" rx="4" fill="#37474f"/>
                    <path d="M 210,130 Q 230,70 170,45" fill="none" stroke="#78909c" stroke-width="10" stroke-linecap="round"/>
                    <!-- Tube optique & Oculaire -->
                    <rect x="125" y="15" width="22" height="30" fill="#00bcd4" rx="2"/>
                    <rect x="120" y="10" width="32" height="7" fill="#0097a7" rx="2"/>
                    <polygon points="120,45 152,45 146,85 126,85" fill="#546e7a"/>
                    <!-- Platine -->
                    <rect x="95" y="90" width="75" height="6" fill="#263238"/>
                    <!-- Légendes -->
                    <text x="136" y="8" fill="#80deea" font-size="8" text-anchor="middle">Oculaire</text>
                    <text x="180" y="94" fill="#ffffff" font-size="8">Platine porte-lame</text>
                    <text x="160" y="155" fill="#cfd8dc" font-size="9" text-anchor="middle" font-weight="bold">Microscope optique composé</text>
                </svg>
            `,
            texte: `Pour examiner des détails invisibles, le microscope utilise deux systèmes de lentilles : <span class="word-click" onclick="clickWord(this, false)">l'oculaire et les objectifs</span>. Un manuel erroné indique qu'il faut régler la mise au point en <span class="word-click" onclick="clickWord(this, true)">frappant fort sur la lame de verre</span>. Il prétend également que l'oculaire sert à <span class="word-click" onclick="clickWord(this, true)">projeter un son aigu dans l'oreille</span> au lieu d'observer l'échantillon.`
        },
        {
            schema: `
                <svg viewBox="0 0 320 160" class="schema-svg">
                    <!-- Membrane poreuse sélective -->
                    <circle cx="160" cy="80" r="58" fill="#102027" stroke="#00e676" stroke-width="4" stroke-dasharray="6,4"/>
                    <!-- Échanges -->
                    <path d="M 80,80 L 115,80" stroke="#ffeb3b" stroke-width="2" marker-end="url(#arrow)"/>
                    <text x="95" y="73" fill="#ffeb3b" font-size="8">Nutriments</text>
                    <path d="M 205,80 L 240,80" stroke="#ff5252" stroke-width="2"/>
                    <text x="210" y="73" fill="#ff5252" font-size="8">Déchets</text>
                    <text x="160" y="22" fill="#69f0ae" font-size="10" text-anchor="middle" font-weight="bold">Membrane plasmique semi-perméable</text>
                </svg>
            `,
            texte: `La <span class="word-click" onclick="clickWord(this, false)">membrane plasmique</span> enveloppe la cellule et filtre les échanges avec l'extérieur. Un résumé incorrect assure qu'elle forme une muraille <span class="word-click" onclick="clickWord(this, true)">imperméable faite d'écorce de chêne</span>. Une autre affirmation prétend qu'elle <span class="word-click" onclick="clickWord(this, true)">retient les déchets toxiques à l'intérieur</span> au lieu de les expulser.`
        },
        {
            schema: `
                <svg viewBox="0 0 320 160" class="schema-svg">
                    <!-- Cytoplasme fluide -->
                    <ellipse cx="160" cy="80" rx="130" ry="55" fill="rgba(33, 150, 243, 0.15)" stroke="#29b6f6" stroke-width="2"/>
                    <circle cx="160" cy="80" r="20" fill="#1a237e"/>
                    <!-- Particules en mouvement -->
                    <circle cx="90" cy="65" r="4" fill="#81d4fa"/>
                    <circle cx="230" cy="90" r="5" fill="#81d4fa"/>
                    <circle cx="130" cy="115" r="3" fill="#81d4fa"/>
                    <text x="160" y="24" fill="#b3e5fc" font-size="10" text-anchor="middle" font-weight="bold">Le cytoplasme : milieu aqueux interne</text>
                </svg>
            `,
            texte: `Entre le noyau et la membrane s'étend le <span class="word-click" onclick="clickWord(this, false)">cytoplasme</span>, un liquide transparent dans lequel baignent les organites. Un schéma faux indique que ce milieu est <span class="word-click" onclick="clickWord(this, true)">rempli de ciment solide figé</span>. Le rapport affirme en outre qu'il a pour fonction de <span class="word-click" onclick="clickWord(this, true)">brûler la cellule pour chauffer le corps</span>.`
        },
        {
            schema: `
                <svg viewBox="0 0 320 160" class="schema-svg">
                    <!-- Paroi végétale rigide -->
                    <rect x="60" y="30" width="200" height="100" rx="8" fill="#1b5e20" stroke="#aed581" stroke-width="6"/>
                    <rect x="72" y="42" width="176" height="76" rx="4" fill="#2e7d32"/>
                    <circle cx="120" cy="80" r="16" fill="#311b92"/>
                    <text x="160" y="22" fill="#c5e1a5" font-size="10" text-anchor="middle" font-weight="bold">Paroi cellulosique (cellule végétale)</text>
                    <text x="200" y="85" fill="#ffffff" font-size="8">Forme géométrique fixe</text>
                </svg>
            `,
            texte: `Contrairement aux animaux, les plantes possèdent une <span class="word-click" onclick="clickWord(this, false)">paroi cellulosique rigide</span> qui confère leur maintien aux végétaux. Une étiquette erronée affirme que cette paroi est <span class="word-click" onclick="clickWord(this, true)">présente dans les globules rouges humains</span>. Une seconde note affirme qu'elle <span class="word-click" onclick="clickWord(this, true)">rend la plante liquide dès qu'il fait chaud</span>.`
        },
        {
            schema: `
                <svg viewBox="0 0 320 160" class="schema-svg">
                    <!-- Chloroplaste & Thylakoïdes -->
                    <ellipse cx="160" cy="80" rx="80" ry="45" fill="#2e7d32" stroke="#76ff03" stroke-width="2"/>
                    <rect x="110" y="65" width="25" height="6" rx="2" fill="#b2ff59"/>
                    <rect x="110" y="75" width="25" height="6" rx="2" fill="#b2ff59"/>
                    <rect x="110" y="85" width="25" height="6" rx="2" fill="#b2ff59"/>
                    <rect x="180" y="65" width="25" height="6" rx="2" fill="#b2ff59"/>
                    <rect x="180" y="75" width="25" height="6" rx="2" fill="#b2ff59"/>
                    <text x="160" y="25" fill="#ccff90" font-size="10" text-anchor="middle" font-weight="bold">Chloroplaste & Chlorophylle (Photosynthèse)</text>
                </svg>
            `,
            texte: `Grâce aux <span class="word-click" onclick="clickWord(this, false)">chloroplastes</span>, la cellule végétale capte l'énergie de la lumière pour fabriquer du glucose. Une coquille dans la leçon soutient qu'ils sont <span class="word-click" onclick="clickWord(this, true)">responsables de la digestion des os</span>. Enfin, le texte prétend à tort que la photosynthèse permet de <span class="word-click" onclick="clickWord(this, true)">fabriquer du plastique sous terre</span>.`
        },
        {
            schema: `
                <svg viewBox="0 0 320 160" class="schema-svg">
                    <!-- Lame porte-objet & Lamelle -->
                    <rect x="60" y="70" width="200" height="30" fill="rgba(255,255,255,0.2)" stroke="#eceff1" stroke-width="2"/>
                    <!-- Goutte & Échantillon -->
                    <circle cx="160" cy="85" r="8" fill="#4fc3f7"/>
                    <!-- Lamelle couvre-objet inclinée -->
                    <line x1="135" y1="75" x2="185" y2="70" stroke="#80d8ff" stroke-width="3"/>
                    <text x="160" y="45" fill="#80d8ff" font-size="9" text-anchor="middle">Descente délicate à 45° pour éviter les bulles</text>
                    <text x="160" y="125" fill="#cfd8dc" font-size="9" text-anchor="middle" font-weight="bold">Préparation microscopique (Lame & Lamelle)</text>
                </svg>
            `,
            texte: `Pour observer des cellules d'oignon, on dépose l'échantillon avec une goutte d'eau entre <span class="word-click" onclick="clickWord(this, false)">une lame et une lamelle</span>. Le protocole comporte une faute stipulant qu'il faut <span class="word-click" onclick="clickWord(this, true)">emprisonner de grosses bulles d'air géantes</span>. Il conseille aussi faussement de <span class="word-click" onclick="clickWord(this, true)">peindre la lamelle avec de l'encre noire opaque</span>.`
        },
        {
            schema: `
                <svg viewBox="0 0 320 160" class="schema-svg">
                    <rect x="50" y="40" width="220" height="80" rx="10" fill="#212121" stroke="#ffd54f" stroke-width="2"/>
                    <text x="160" y="70" fill="#fff59d" font-size="16" text-anchor="middle" font-weight="bold">Oculaire 10x × Objectif 40x = 400x</text>
                    <text x="160" y="98" fill="#ffffff" font-size="10" text-anchor="middle">L'image est grossie 400 fois par rapport au réel</text>
                    <text x="160" y="24" fill="#ffe082" font-size="10" text-anchor="middle" font-weight="bold">Formule du grossissement total</text>
                </svg>
            `,
            texte: `Le <span class="word-click" onclick="clickWord(this, false)">grossissement total</span> s'obtient en multipliant le pouvoir grossissant de l'oculaire par celui de l'objectif. L'élève doit corriger une phrase affirmant que ce calcul se fait en <span class="word-click" onclick="clickWord(this, true)">divisant les nombres par zéro</span>. De surcroît, le guide indique que grossir un objet le rend <span class="word-click" onclick="clickWord(this, true)">absolument invisible à l'écran</span>.`
        },
        {
            schema: `
                <svg viewBox="0 0 320 160" class="schema-svg">
                    <rect x="70" y="30" width="180" height="100" rx="10" fill="#1b5e20" stroke="#aed581" stroke-width="2"/>
                    <!-- Grande vacuole centrale d'eau -->
                    <ellipse cx="160" cy="80" rx="65" ry="35" fill="#0288d1" stroke="#81d4fa" stroke-width="2"/>
                    <text x="160" y="84" fill="#ffffff" font-size="10" text-anchor="middle" font-weight="bold">Vacuole centrale (réserve d'eau)</text>
                    <text x="160" y="20" fill="#aed581" font-size="10" text-anchor="middle" font-weight="bold">Régulation de la turgescence</text>
                </svg>
            `,
            texte: `Dans la cellule végétale adulte, la <span class="word-click" onclick="clickWord(this, false)">vacuole</span> stocke une grande réserve d'eau et maintient la plante droite. Une note d'étude prétend faussement qu'elle est <span class="word-click" onclick="clickWord(this, true)">remplie d'essence de voiture inflammable</span>. Une autre affirmation indique qu'elle <span class="word-click" onclick="clickWord(this, true)">sert à propulser la feuille dans les airs</span>.`
        },
        {
            schema: `
                <svg viewBox="0 0 320 160" class="schema-svg">
                    <!-- Organismes unicellulaires (ex: paramécie ciliée) -->
                    <path d="M 100,80 C 100,50 140,40 180,45 C 220,50 230,80 210,110 C 190,125 120,120 100,80 Z" fill="#00695c" stroke="#64ffda" stroke-width="2"/>
                    <!-- Cils vibratiles -->
                    <circle cx="160" cy="75" r="8" fill="#e040fb"/>
                    <text x="165" y="78" fill="#ffffff" font-size="6">Noyau</text>
                    <text x="160" y="145" fill="#a7ffeb" font-size="9" text-anchor="middle">Organisme vivant autonome à 1 seule cellule</text>
                    <text x="160" y="22" fill="#64ffda" font-size="10" text-anchor="middle" font-weight="bold">Être unicellulaire (ex. Paramécie)</text>
                </svg>
            `,
            texte: `Certains organismes microscopiques sont dits <span class="word-click" onclick="clickWord(this, false)">unicellulaires</span> car ils n'ont qu'une seule cellule pour accomplir toutes leurs fonctions vitales. Le corrigé contient une erreur affirmant qu'ils <span class="word-click" onclick="clickWord(this, true)">possèdent un squelette composé d'acier</span>. Enfin, le carnet insinue à tort qu'ils sont <span class="word-click" onclick="clickWord(this, true)">capables de vivre uniquement sur le soleil</span>.`
        }
    ];

    function afficherManche(index) {
        erreursTrouvees = 0;
        document.getElementById("count").innerText = "0";
        document.getElementById("bar").style.width = "0%";
        document.getElementById("manche-text").innerText = `${index} / ${TOTAL_MANCHES}`;

        const donnees = MANCHES_BIOLOGIE[index - 1];
        document.getElementById("schema-display").innerHTML = donnees.schema;
        document.getElementById("lesson-content").innerHTML = donnees.texte;
    }

    window.clickWord = function(element, isError) {
        if (element.classList.contains("correct-error")) return;

        if (isError) {
            element.classList.remove("wrong-click");
            element.classList.add("correct-error");
            erreursTrouvees++;
            document.getElementById("count").innerText = erreursTrouvees;
            document.getElementById("bar").style.width = (erreursTrouvees / ERREURS_PAR_MANCHE) * 100 + "%";

            if (erreursTrouvees === ERREURS_PAR_MANCHE) {
                setTimeout(() => {
                    passerTexteSuivant();
                }, 800);
            }
        } else {
            element.classList.add("wrong-click");
            setTimeout(() => {
                element.classList.remove("wrong-click");
            }, 700);
        }
    };

    window.passerTexteSuivant = function() {
        if (erreursTrouvees < ERREURS_PAR_MANCHE) {
            alert(`Il reste encore ${ERREURS_PAR_MANCHE - erreursTrouvees} erreur(s) à démasquer sur ce schéma !`);
            return;
        }

        if (mancheActuelle < TOTAL_MANCHES) {
            mancheActuelle++;
            afficherManche(mancheActuelle);
        } else {
            document.getElementById("schema-display").style.display = "none";
            document.getElementById("lesson-content").style.display = "none";
            document.getElementById("btn-suite").style.display = "none";
            document.getElementById("reward").style.display = "block";
            setTimeout(() => {
                window.location.href = "index.html";
            }, 3000);
        }
    };

    afficherManche(mancheActuelle);
</script>

</body>
</html>
