<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nox - Chasse aux erreurs</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(180deg, #13174a, #262d84, #3f4dbf);
    color: white;
    min-height: 100vh;
}

.container {
    max-width: 700px;
    margin: auto;
    padding: 20px;
}

.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
}

.btn-retour {
    background: rgba(255, 255, 255, 0.15);
    color: #7fe7ff;
    text-decoration: none;
    padding: 8px 14px;
    border-radius: 12px;
    font-weight: 600;
    font-size: 14px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: 0.2s;
}

.btn-retour:hover {
    background: rgba(255, 255, 255, 0.25);
}

.header {
    text-align: center;
}

/* Nox magique : flottaison et lueur */
.nox {
    width: 85px;
    height: 85px;
    object-fit: contain;
    animation: flotter 4s ease-in-out infinite, briller 2s ease-in-out infinite;
}

@keyframes briller {
    0% { filter: drop-shadow(0 0 8px #7FE7FF); }
    50% { filter: drop-shadow(0 0 25px #E2A7FF); }
    100% { filter: drop-shadow(0 0 8px #7FE7FF); }
}

@keyframes flotter {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-10px); }
}

.header h1 {
    margin: 10px 0 4px 0;
    font-size: 24px;
}

.lesson-badge {
    display: inline-block;
    background: rgba(127, 231, 255, 0.15);
    color: #7fe7ff;
    border: 1px solid rgba(127, 231, 255, 0.3);
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 13px;
    margin-top: 6px;
}

.card {
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 25px;
    padding: 20px;
    margin-top: 15px;
}

.status-bar {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 8px;
}

.progress {
    width: 100%;
    height: 16px;
    background: rgba(0, 0, 0, 0.4);
    border-radius: 50px;
    overflow: hidden;
    margin-bottom: 20px;
}

.progress-fill {
    width: 0%;
    height: 100%;
    background: linear-gradient(90deg, #7fe7ff, #c896ff);
    transition: width 0.3s ease;
}

/* Zone du texte de la leçon */
.book-area {
    background: rgba(10, 15, 35, 0.85);
    border: 2px dashed rgba(127, 231, 255, 0.35);
    border-radius: 20px;
    padding: 24px 20px;
    min-height: 200px;
    line-height: 1.9;
    font-size: 15px;
    color: #e2e8f0;
}

/* Mots d'apparence identique avant tout clic */
.word-click {
    cursor: pointer;
    border-radius: 4px;
    padding: 1px 4px;
    transition: background 0.15s ease;
}

.word-click:hover {
    background: rgba(255, 255, 255, 0.15);
}

/* Révélé uniquement si c'est une vraie erreur */
.word-click.correct-error {
    background: rgba(108, 255, 149, 0.3);
    color: #6cff95;
    text-decoration: line-through;
    border-bottom: 2px solid #6cff95;
    cursor: default;
}

/* Surlignage bref en cas de mauvais clic */
.word-click.wrong-click {
    background: rgba(255, 95, 122, 0.3);
    color: #ff8598;
}

button {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 15px;
    background: linear-gradient(135deg, #4facfe, #00f2fe);
    color: #070b19;
    font-weight: 700;
    font-size: 16px;
    margin-top: 20px;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(0, 242, 254, 0.3);
    transition: 0.2s ease;
}

button:hover {
    opacity: 0.92;
}

.reward {
    text-align: center;
    font-size: 20px;
    font-weight: 700;
    color: #6cff95;
    margin-top: 20px;
    display: none;
}
</style>
</head>
<body>

<div class="container">

    <div class="top-bar">
        <a href="index.html" class="btn-retour">
            <i class="fa-solid fa-arrow-left"></i> Retour au QG
        </a>
        <div style="font-size: 13px; color: #ffd166; font-weight: 700;">
            <i class="fa-solid fa-star"></i> +50 XP
        </div>
    </div>

    <div class="header">
        <img class="nox" id="nox-img" src="images/Nox.png" alt="Nox">
        <h1>Chasse aux erreurs</h1>
        <p>Aide Nox à débusquer les 3 erreurs cachées dans la leçon !</p>
        <div id="lesson-title" class="lesson-badge">
            <i class="fa-solid fa-spinner fa-spin"></i> Chargement de la leçon...
        </div>
    </div>

    <div class="card">
        <div class="status-bar">
            <span>Erreurs trouvées :</span>
            <span><span id="count">0</span> / 3</span>
        </div>

        <div class="progress">
            <div id="bar" class="progress-fill"></div>
        </div>

        <div class="book-area" id="lesson-content">
            <p><i class="fa-solid fa-spinner fa-spin"></i> Analyse de ton document...</p>
        </div>

        <button onclick="finishGame()">
            Vérifier et restaurer la page
        </button>

        <div id="reward" class="reward">
            ⭐ Bravo Coco !<br>
            Toutes les erreurs ont été éliminées (+50 XP pour Nox) !
        </div>
    </div>

</div>

<script type="module">
    import { db } from "./firebase.js";
    import { collection, getDocs, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

    const ELEVE_ID = "coco";
    const TOTAL_ERREURS = 3;
    let found = 0;

    const BANQUE_INTRUS = [
        "carré", "inversé", "inexistant", "facultatif", "immobile", 
        "vertical", "horizontal", "artificiel", "négatif", "inutile"
    ];

    async function chargerLecon() {
        const badge = document.getElementById("lesson-title");
        const content = document.getElementById("lesson-content");

        try {
            const q = query(
                collection(db, "utilisateurs", ELEVE_ID, "fiches_cours"),
                orderBy("timestamp", "desc"),
                limit(1)
            );
            const querySnapshot = await getDocs(q);

            let titre = "Leçon active";
            let concepts = [];
            let texteComplet = "";

            if (!querySnapshot.empty) {
                querySnapshot.forEach(doc => {
                    const data = doc.data();
                    if (data.titre) titre = data.titre;
                    if (data.conceptsCles) concepts = data.conceptsCles;
                    if (data.texte) texteComplet = data.texte;
                });
            }

            badge.innerHTML = `<i class="fa-solid fa-book-open"></i> ${titre}`;
            genererDefiDynamique(titre, concepts, texteComplet);

        } catch (err) {
            console.error("Erreur Firestore :", err);
            badge.textContent = "Entraînement de secours";
            genererDefiDynamique("Révision générale", ["notions", "règles", "repères"], "");
        }
    }

    function genererDefiDynamique(titre, concepts, texte) {
        const content = document.getElementById("lesson-content");

        const pieges = [...BANQUE_INTRUS].sort(() => 0.5 - Math.random()).slice(0, 3);
        
        const c1 = concepts[0] || "l'axe central";
        const c2 = concepts[1] || "la latitude";
        const c3 = concepts[2] || "l'hémisphère";

        const phrases = [
            `Dans le document sur <span class="word-click" onclick="clickWord(this, false)">${titre}</span>, `,
            `on étudie comment organiser <span class="word-click" onclick="clickWord(this, false)">les repères essentiels</span>. `,
            `Il est stipulé que <span class="word-click" onclick="clickWord(this, false)">${c1}</span> `,
            `adopte toujours un format <span class="word-click" onclick="clickWord(this, true)">${pieges[0]}</span> `,
            `pour faciliter l'orientation. Concernant <span class="word-click" onclick="clickWord(this, false)">${c2}</span>, `,
            `certaines personnes pensent qu'il est <span class="word-click" onclick="clickWord(this, true)">${pieges[1]}</span> `,
            `alors qu'il détermine la position exacte. Enfin, pour bien délimiter <span class="word-click" onclick="clickWord(this, false)">${c3}</span>, `,
            `on évite d'utiliser un calcul <span class="word-click" onclick="clickWord(this, true)">${pieges[2]}</span> `,
            `qui fausserait toute la carte.`
        ];

        content.innerHTML = phrases.join("");
    }

    window.clickWord = function(element, isError) {
        if (element.classList.contains("correct-error")) return;

        if (isError) {
            element.classList.remove("wrong-click");
            element.classList.add("correct-error");
            found++;
            document.getElementById("count").innerText = found;
            document.getElementById("bar").style.width = (found / TOTAL_ERREURS) * 100 + "%";
        } else {
            element.classList.add("wrong-click");
            setTimeout(() => {
                element.classList.remove("wrong-click");
            }, 800);
        }
    };

    window.finishGame = function() {
        if (found < TOTAL_ERREURS) {
            alert(`Il reste encore ${TOTAL_ERREURS - found} erreur(s) à démasquer !`);
            return;
        }

        document.getElementById("reward").style.display = "block";
        setTimeout(() => {
            window.location.href = "index.html";
        }, 2500);
    };

    chargerLecon();
</script>

</body>
</html>
